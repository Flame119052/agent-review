name: check
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run review, watcher, login and usage tests
        run: |
          bash -n tools/agent-gate.sh
          node --test tools/test-*.mjs
